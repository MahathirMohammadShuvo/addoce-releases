name: macOS acceptance test
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      VERSION: v1.0.0
    steps:
      - run: echo "VERSION=${VERSION} arch=$(uname -m) host=$(hostname)"
      - run: brew install minisign
      - run: |
          set -euo pipefail
          mkdir -p /tmp/work && cd /tmp/work
          curl -fLO "https://github.com/MahathirMohammadShuvo/addoce-releases/releases/download/${VERSION}/verify-release.sh"
          bash verify-release.sh "${VERSION}" --skip-docker
